name: ai_first_flutter_starter
description: An AI-first, feature-first Flutter starter for production apps.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.8'

dependencies:
  dio: ^5.10.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.3

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/translations/
